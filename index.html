    <meta charset="UTF-8" />

    <title>PharmaCore Enterprise | نظام إدارة الصيدليات المتكامل</title>
    <script>
      // Silence Vite HMR WebSocket connection issues in AI Studio preview iframe
      (function() {
        var OrigWS = window.WebSocket;
        if (OrigWS) {
          function SilentWS(url, protocols) {
            if (protocols === 'vite-hmr' || (typeof protocols === 'string' && protocols.indexOf('vite') !== -1) || (typeof url === 'string' && url.indexOf('run.app') !== -1 && url.indexOf('vite') !== -1)) {
              var t = new EventTarget();
              t.url = url;
              t.protocols = protocols;
              t.readyState = 1; // WebSocket.OPEN
              t.send = function() {};
              t.close = function() {};
              t.onopen = null;
              t.onclose = null;
              t.onerror = null;
              t.onmessage = null;
              setTimeout(function() {
                if (t.onopen) t.onopen(new Event('open'));
                t.dispatchEvent(new Event('open'));
              }, 40);
              return t;
            }
            return new OrigWS(url, protocols);
          }
          SilentWS.prototype = OrigWS.prototype;
          SilentWS.CONNECTING = 0;
          SilentWS.OPEN = 1;
          SilentWS.CLOSING = 2;
          SilentWS.CLOSED = 3;
          window.WebSocket = SilentWS;
        }

        var origConsoleError = console.error;
        console.error = function() {
          var args = Array.prototype.slice.call(arguments);
          var text = args.map(function(a) { return String(a && a.stack ? a.stack : a); }).join(' ');
          if (text.indexOf('WebSocket') !== -1 || text.indexOf('@vite/client') !== -1 || text.indexOf('[vite]') !== -1) {
            return;
          }
          return origConsoleError.apply(console, arguments);
        };
        window.addEventListener('error', function(event) {
          var msg = event.message || (event.error && event.error.message) || '';
          if (msg.indexOf('WebSocket') !== -1 || msg.indexOf('@vite/client') !== -1) {
            event.stopImmediatePropagation();
            event.preventDefault();
          }
        }, true);
        window.addEventListener('unhandledrejection', function(event) {
          var reason = String(event.reason && (event.reason.message || event.reason.stack || event.reason) || '');
          if (reason.indexOf('WebSocket') !== -1 || reason.indexOf('@vite/client') !== -1) {
            event.stopImmediatePropagation();
            event.preventDefault();
          }
        }, true);
      })();
    </script>

  <body>
    <div id="root"></div>
    <script>
      // Capture beforeinstallprompt before React mounts
      window.addEventListener('beforeinstallprompt', function(e) {
        e.preventDefault();
        window.__deferredPwaPrompt = e;
        if (window.__onPwaPromptReady) {
          window.__onPwaPromptReady(e);
        }
      });

      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/sw.js', { scope: '/' })
            .then(function(reg) {
              reg.update();
            })
            .catch(function(err) {
              console.warn('SW warning:', err);
            });
        });
      }
    </script>
